<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TallerTrack - Sistema Épico</title>
  <style>
    /* Estilos generales */
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      background: #05070d;
      font-family: 'Courier New', Courier, monospace, sans-serif;
      overflow: hidden;
    }

    /* Fondo cinemático con rejilla cibernética y viñeta láser */
    #loader {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at center, rgba(15, 23, 42, 0.9) 0%, #05070d 100%),
        linear-gradient(rgba(59, 130, 246, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(59, 130, 246, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.8s ease, visibility 0.8s;
    }

    /* Línea de escaneo láser superior (Efecto Sci-Fi) */
    #loader::before {
      content: "";
      position: absolute;
      top: 0; left: 0; width: 100%; height: 2px;
      background: #3b82f6;
      box-shadow: 0 0 15px #3b82f6, 0 0 30px #8b5cf6;
      animation: scanline 3s linear infinite;
    }

    @keyframes scanline {
      0% { top: 0%; opacity: 1; }
      50% { opacity: 0.5; }
      100% { top: 100%; opacity: 1; }
    }

    /* Tarjeta de Control Épica */
    .epic-card {
      position: relative;
      background: rgba(10, 14, 26, 0.85);
      border: 1px solid rgba(139, 92, 246, 0.3);
      border-radius: 12px;
      padding: 50px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 0 50px rgba(15, 23, 42, 0.8), 
                  inset 0 0 20px rgba(139, 92, 246, 0.1);
      backdrop-filter: blur(10px);
    }

    /* Contenedor de engranajes concéntricos */
    .gear-container {
      position: relative;
      width: 100px;
      height: 100px;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Anillo energético exterior giratorio */
    .energy-ring {
      position: absolute;
      inset: -8px;
      border: 2px dashed rgba(59, 130, 246, 0.6);
      border-radius: 50%;
      animation: spin-reverse 8s linear infinite;
    }

    .gear {
      width: 65px;
      height: 65px;
      fill: #3b82f6;
      filter: drop-shadow(0 0 10px rgba(59, 130, 246, 0.8));
      animation: spin 4s linear infinite;
    }

    .wrench {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 32px;
      height: 32px;
      fill: #ffffff;
      transform: translate(-50%, -50%);
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
      animation: pulse-epic 2s ease-in-out infinite;
    }

    /* Títulos y subtítulos con estilo HUD */
    .epic-title {
      color: #ffffff;
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 6px;
      text-transform: uppercase;
      margin-bottom: 8px;
      text-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
    }

    .epic-status {
      color: #94a3b8;
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 25px;
    }

    /* Barra de Progreso Energética */
    .progress-bar-container {
      width: 220px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }

    .progress-bar-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 100%;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #3b82f6);
      background-size: 200% 100%;
      animation: load-progress 2.5s ease-in-out infinite;
      box-shadow: 0 0 10px #8b5cf6;
    }

    /* Animaciones complejas */
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes spin-reverse {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    @keyframes pulse-epic {
      0%, 100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
      50% { transform: translate(-50%, -50%) scale(1.15) rotate(-10deg); }
    }

    @keyframes load-progress {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(0%); }
      100% { transform: translateX(100%); }
    }

    /* Iframe a pantalla completa */
    .fullscreen-iframe {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      border: 0;
      opacity: 0;
      transition: opacity 1s ease-in;
    }

    .loaded #loader {
      opacity: 0;
      visibility: hidden;
    }
    .loaded .fullscreen-iframe {
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Pantalla de Carga Épica -->
  <div id="loader">
    <div class="epic-card">
      <div class="gear-container">
        <div class="energy-ring"></div>
        <!-- Engranaje -->
        <svg class="gear" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 15.5C13.93 15.5 15.5 13.93 15.5 12C15.5 10.07 13.93 8.5 12 8.5C10.07 8.5 8.5 10.07 8.5 12C8.5 13.93 10.07 15.5 12 15.5M19.43 12.97C19.47 12.65 19.5 12.33 19.5 12C19.5 11.67 19.47 11.34 19.43 11L21.54 9.37C21.73 9.22 21.78 8.95 21.66 8.73L19.66 5.27C19.54 5.05 19.27 4.97 19.05 5.05L16.56 6.05C16.04 5.65 15.48 5.32 14.87 5.07L14.49 2.42C14.46 2.18 14.25 2 14 2H10C9.75 2 9.54 2.18 9.51 2.42L9.13 5.07C8.52 5.32 7.96 5.66 7.44 6.05L4.95 5.05C4.73 4.97 4.46 5.05 4.34 5.27L2.34 8.73C2.21 8.95 2.27 9.22 2.46 9.37L4.57 11C4.53 11.34 4.5 11.67 4.5 12C4.5 12.33 4.53 12.65 4.57 12.97L2.46 14.63C2.27 14.78 2.21 15.05 2.34 15.27L4.34 18.73C4.46 18.95 4.73 19.03 4.95 18.95L7.44 17.94C7.96 18.34 8.52 18.68 9.13 18.93L9.51 21.58C9.54 21.82 9.75 22 10 22H14C14.25 22 14.46 21.82 14.49 21.58L14.87 18.93C15.48 18.67 16.04 18.34 16.56 17.94L19.05 18.95C19.27 19.03 19.54 18.95 19.66 18.73L21.66 15.27C21.78 15.05 21.73 14.78 21.54 14.63L19.43 12.97Z"/>
        </svg>
        <!-- Llave -->
        <svg class="wrench" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M13.78 12.3L21.5 4.58L19.42 2.5L11.7 10.22L5.42 3.94L2.1 7.26L8.38 13.54L2.5 19.42L4.58 21.5L10.46 15.62L16.74 21.9L20.06 18.58L13.78 12.3Z"/>
        </svg>
      </div>
      <div class="epic-title">TallerTrack</div>
      <div class="epic-status">Sincronizando Núcleos...</div>
      <div class="progress-bar-container">
        <div class="progress-bar-fill"></div>
      </div>
    </div>
  </div>

  <!-- Aplicación Principal -->
  <iframe
    id="mainFrame"
    class="fullscreen-iframe"
    src="https://movilcell.onrender.com/"
    allowfullscreen
    loading="eager"
    referrerpolicy="no-referrer"
    title="TallerTrack App"
  ></iframe>

  <script>
    const iframe = document.getElementById('mainFrame');
    
    function hideLoader() {
      document.body.classList.add('loaded');
    }

    const forceShow = setTimeout(hideLoader, 8000); 

    iframe.onload = function() {
      clearTimeout(forceShow);
      hideLoader();
    };
  </script>
</body>
</html>
